services:
  - type: web
    name: servewell-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
