name: Mobile App Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build --workspace=apps/restaurant

      - name: Create GitHub Release with OTA Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          cd apps/restaurant
          zip -r bundle.zip out/
          gh release create "v${VERSION}" bundle.zip \
            --title "App Bundle v${VERSION}" \
            --notes "Auto-released by GitHub Actions build #${{ github.run_number }}"
          BUNDLE_URL="https://github.com/Shahithyan-dev/billing-software/releases/download/v${VERSION}/bundle.zip"
          echo "{\"version\":\"${VERSION}\",\"url\":\"${BUNDLE_URL}\"}" > latest.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "chore: update OTA bundle to v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Sync Capacitor
        working-directory: ./apps/restaurant
        run: npx cap sync android

      - name: Build APK
        working-directory: ./apps/restaurant/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ServeWell-POS-Android-APK
          path: apps/restaurant/android/app/build/outputs/apk/debug/app-debug.apk
