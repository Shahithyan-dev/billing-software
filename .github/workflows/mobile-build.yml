name: Mobile App Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build --workspace=apps/frontend

      - name: Deploy OTA Update to Capgo
        working-directory: ./apps/frontend
        run: npx @capgo/cli@latest bundle upload com.servewell.pos -a ${{ secrets.CAPGO_TOKEN }} -p ./out --channel production
        continue-on-error: true

      - name: Sync Capacitor
        working-directory: ./apps/frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: ./apps/frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ServeWell-POS-Android-APK
          path: apps/frontend/android/app/build/outputs/apk/debug/app-debug.apk
